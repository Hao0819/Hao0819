name: Metrics

# NOTE: this workflow needs a Personal Access Token stored as the repository
# secret METRICS_TOKEN. The built-in GITHUB_TOKEN is NOT enough — it is only
# used to commit the rendered SVGs back to this repo.
#
# Both plugins used here are marked "(scopeless)" upstream, so a classic PAT
# with NO scopes ticked is sufficient.

on:
  schedule:
    # Refresh the calendar and language stats once a day
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.plugin.isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Languages activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.plugin.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage, lines
          # The default algorithm counts every byte in each repo you touched,
          # including code written by teammates. indepth clones the repos and
          # attributes commits, so these figures reflect what was actually
          # authored by the identities listed below.
          plugin_languages_indepth: yes
          commits_authoring: Hao0819, junhao060103@gmail.com, limjh-wm24@student.tarc.edu.my, 181139503+Hao0819@users.noreply.github.com
          # Notebooks embed their output (images, base64) in the file itself,
          # so they dominate any byte-based count.
          plugin_languages_ignored: jupyter notebook
